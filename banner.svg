<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Kevin Clavasquin - Software Developer, CS student at MSOE" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#1b1442"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- glow orbs -->
  <circle cx="1020" cy="70" r="130" fill="#58a6ff" opacity="0.08"/>
  <circle cx="1120" cy="260" r="110" fill="#bc8cff" opacity="0.09"/>

  <!-- window dots -->
  <circle cx="44" cy="40" r="7" fill="#ff5f56"/>
  <circle cx="68" cy="40" r="7" fill="#ffbd2e"/>
  <circle cx="92" cy="40" r="7" fill="#27c93f"/>
  <text x="120" y="45" class="mono" font-size="14" fill="#8b949e">~/kevin/portfolio</text>

  <!-- text -->
  <text x="60" y="120" class="mono" font-size="20" fill="#7ee787">$ whoami</text>
  <text x="60" y="190" class="sans" font-size="64" font-weight="800" fill="url(#accent)">Kevin Clavasquin</text>
  <text x="60" y="238" class="sans" font-size="26" fill="#c9d1d9">Software Developer · CS Student @ MSOE</text>
  <text x="60" y="280" class="mono" font-size="18" fill="#8b949e">React  ·  PHP  ·  C++/Qt  ·  Java  ·  Python + AI</text>
  <rect class="cursor" x="640" y="262" width="11" height="22" fill="#58a6ff"/>

  <!-- floating code glyphs -->
  <g class="float" transform="translate(900,110)">
    <text class="mono" font-size="110" font-weight="700" fill="url(#accent)" opacity="0.9">&lt;/&gt;</text>
  </g>
  <g class="mono" font-size="16" fill="#58a6ff" opacity="0.35">
    <text x="1010" y="230">{ }</text>
    <text x="1110" y="190">[ ]</text>
    <text x="940" y="275">( )</text>
  </g>

  <!-- bottom accent line -->
  <rect x="0" y="312" width="1200" height="8" rx="4" fill="url(#accent)"/>
</svg>
